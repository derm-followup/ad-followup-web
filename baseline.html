<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>儿童AD基线建档</title>
  <link rel="stylesheet" href="https://fastly.jsdelivr.net/npm/vant@4/lib/index.css" />
  <style>
    body { background:#f7f8fa; margin:0; }
    .page { max-width: 760px; margin: 0 auto; padding-bottom: 32px; }
    .header { padding: 18px 16px 8px; }
    .title { font-size: 22px; font-weight: 700; }
    .subtitle { color:#666; font-size: 13px; margin-top: 6px; }
    .card { margin: 12px; border-radius: 14px; overflow:hidden; }
    .hint { color:#888; font-size:12px; padding: 0 16px 8px; }
  </style>
</head>
<body>
<div id="app" class="page">
  <div class="header">
    <div class="title">儿童AD首诊基线建档</div>
    <div class="subtitle">医生/研究助理填写，一名患儿只建立一次 baseline 记录</div>
  </div>

  <van-form @submit="submitForm">
    <van-cell-group inset class="card">
      <van-field v-model="form.study_id" name="study_id" label="研究编号" placeholder="如 AD001" required />
      <van-field name="sex" label="性别" required>
        <template #input>
          <van-radio-group v-model="form.sex" direction="horizontal">
            <van-radio name="M">男</van-radio>
            <van-radio name="F">女</van-radio>
          </van-radio-group>
        </template>
      </van-field>
      <van-field v-model.number="form.age_month" type="number" label="年龄(月)" placeholder="如 36" required />
      <van-field v-model.number="form.disease_duration_month" type="number" label="病程(月)" placeholder="如 12" />
      <van-field v-model.number="form.onset_age_month" type="number" label="发病年龄(月)" placeholder="如 8" />
    </van-cell-group>

    <van-cell-group inset class="card">
      <van-field v-model.number="form.baseline_easi" type="number" label="基线EASI" placeholder="如 6.5" />
      <van-field name="baseline_iga" label="基线IGA">
        <template #input>
          <van-stepper v-model="form.baseline_iga" min="0" max="4" />
        </template>
      </van-field>
      <van-field name="itch_nrs_baseline" label="瘙痒NRS">
        <template #input>
          <van-slider v-model="form.itch_nrs_baseline" :min="0" :max="10" bar-height="6px" style="width:70%" />
          <span style="margin-left:12px">{{ form.itch_nrs_baseline }}</span>
        </template>
      </van-field>
      <van-field name="sleep_nrs_baseline" label="睡眠影响">
        <template #input>
          <van-slider v-model="form.sleep_nrs_baseline" :min="0" :max="10" bar-height="6px" style="width:70%" />
          <span style="margin-left:12px">{{ form.sleep_nrs_baseline }}</span>
        </template>
      </van-field>
      <van-field v-model.number="form.relapse_past_6m" type="number" label="近6月复发次数" placeholder="如 3" />
    </van-cell-group>

    <van-cell-group inset class="card">
      <van-field name="family_atopy" label="家族过敏史">
        <template #input><van-switch v-model="form.family_atopy" size="22" /></template>
      </van-field>
      <van-field name="allergic_rhinitis" label="过敏性鼻炎">
        <template #input><van-switch v-model="form.allergic_rhinitis" size="22" /></template>
      </van-field>
      <van-field name="asthma" label="哮喘">
        <template #input><van-switch v-model="form.asthma" size="22" /></template>
      </van-field>
      <van-field name="food_allergy" label="食物过敏">
        <template #input><van-switch v-model="form.food_allergy" size="22" /></template>
      </van-field>
    </van-cell-group>

    <van-cell-group inset class="card">
      <van-field name="steroid_phobia_nrs" label="激素担心程度">
        <template #input>
          <van-slider v-model="form.steroid_phobia_nrs" :min="0" :max="10" bar-height="6px" style="width:70%" />
          <span style="margin-left:12px">{{ form.steroid_phobia_nrs }}</span>
        </template>
      </van-field>
      <div class="hint">0=完全不担心；10=非常担心</div>

      <van-field name="moisturizer_freq" label="保湿频率">
        <template #input>
          <van-radio-group v-model="form.moisturizer_freq">
            <van-radio name="rarely">很少</van-radio>
            <van-radio name="occasional">偶尔</van-radio>
            <van-radio name="daily_once">每日1次</van-radio>
            <van-radio name="daily_twice">每日≥2次</van-radio>
          </van-radio-group>
        </template>
      </van-field>

      <van-field name="group_type" label="分组">
        <template #input>
          <van-radio-group v-model="form.group_type">
            <van-radio name="usual_care">常规管理组</van-radio>
            <van-radio name="standard_seq">标准化序贯管理组</van-radio>
          </van-radio-group>
        </template>
      </van-field>

      <van-field v-model="form.initial_treatment" rows="3" autosize type="textarea" label="首次治疗方案" placeholder="如：地奈德bid 5天 + 保湿 + 复诊建议" />
      <van-field name="consent_status" label="同意随访/科研">
        <template #input><van-switch v-model="form.consent_status" size="22" /></template>
      </van-field>
    </van-cell-group>

    <div style="margin: 20px 12px;">
      <van-button round block type="primary" native-type="submit" :loading="loading">提交建档</van-button>
    </div>
  </van-form>
</div>

<script src="https://fastly.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
<script src="https://fastly.jsdelivr.net/npm/vant@4/lib/vant.min.js"></script>
<script src="https://fastly.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

// ====== Supabase 配置：请替换为你自己的 ======
const SUPABASE_URL = "https://你的项目.supabase.co";
const SUPABASE_ANON_KEY = "你的 anon public key";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const { createApp, reactive, ref } = Vue;

createApp({
  setup() {
    const loading = ref(false);
    const form = reactive({
      study_id: "",
      sex: "",
      age_month: null,
      disease_duration_month: null,
      onset_age_month: null,
      baseline_easi: null,
      baseline_iga: 0,
      itch_nrs_baseline: 0,
      sleep_nrs_baseline: 0,
      relapse_past_6m: null,
      family_atopy: false,
      allergic_rhinitis: false,
      asthma: false,
      food_allergy: false,
      steroid_phobia_nrs: 0,
      moisturizer_freq: "daily_once",
      group_type: "usual_care",
      initial_treatment: "",
      consent_status: true
    });

    async function submitForm() {
      if (!form.study_id || !form.sex || form.age_month === null) {
        vant.showToast("请填写研究编号、性别、年龄");
        return;
      }
      loading.value = true;
      const payload = { ...form, study_id: form.study_id.trim().toUpperCase() };
      const { error } = await supabaseClient.from("baseline_table").insert([payload]);
      loading.value = false;
      if (error) {
        console.error(error);
        vant.showDialog({ title: "提交失败", message: error.message });
      } else {
        vant.showSuccessToast("建档成功");
      }
    }

    return { form, loading, submitForm };
  }
}).use(vant).mount("#app");
</script>
</body>
</html>
